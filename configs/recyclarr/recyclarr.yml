# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

################################################################################
## SONARR
################################################################################

sonarr:
  sonarr:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9  # WEB-1080p (Alternative) - Bluray/HDTV fallback for older shows
        reset_unmatched_scores:
          enabled: true

    # Guide only applies these groups to WEB-2160p
    custom_format_groups:
      add:
        - trash_id: e0b2774083df4265f25c9e5bc6c80940  # [HDR Formats] DV Boost
        - trash_id: d776a1ea912a117d66d83b880ff2055d  # [HDR Formats] DV (w/o HDR fallback)

################################################################################
## RADARR
################################################################################

radarr:
  radarr:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    # Groups only score profiles on their guide include list:
    # DV groups -> UHD only, Movie Versions + Language -> UHD and HD
    custom_format_groups:
      add:
        - trash_id: 1616617ab3a14397a2b2321bcbda44d1  # [HDR Formats] DV Boost
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76  # [HDR Formats] DV (w/o HDR fallback)
        - trash_id: 13856622cf7a6c9925d3a83f8812d679  # [Optional] Language Profiles
          select:
            - d6e9318c875905d6cfb5bee961afcea9  # Language: Not Original
        - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
          select:
            - eca37840c13c6ef2dd0262b141a5482f  # 4K Remaster
            - eecf3a857724171f968a66cb5719e152  # IMAX
            - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced
            - 0f12c086e289cf966fa5948eac571f44  # Hybrid
            - 570bc9ebecd92723d2d21500f4be314c  # Remaster
        # HD only: block x265 SDR re-encodes but allow x265 HDR/DV
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
          select:
            - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
          exclude:
            - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)

    # Prefer HDR/DV at 1080p. HDR outscores HD tier bonuses (1600-1800)
    custom_formats:
      - trash_ids:
          - 493b6d1dbec3c3364c59d7607f7e3405  # HDR
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 2000
      - trash_ids:
          - b337d6812e06c200ec9a2d3cfa9d20a7  # DV Boost
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
        assign_scores_to:
          - name: HD Bluray + WEB
