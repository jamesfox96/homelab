services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_HOST: ${HOST_IP}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_SONARR_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${BAZARR_API_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY}
      HOMEPAGE_VAR_QBIT_USER: ${QBIT_USER}
      HOMEPAGE_VAR_QBIT_PASS: ${QBIT_PASS}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_SEERR_KEY: ${SEERR_API_KEY}
      HOMEPAGE_VAR_PIHOLE_KEY: ${PIHOLE_API_KEY}
      HOMEPAGE_VAR_GLUETUN_KEY: ${GLUETUN_API_KEY}
      HOMEPAGE_VAR_CF_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      HOMEPAGE_VAR_CF_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID}
      HOMEPAGE_VAR_CF_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    depends_on:
      - dockerproxy
    volumes:
      - ./config:/app/config   # dashboard layout lives in the repo
      - ${DATA_ROOT}:/storage:ro  # only used for free-space readout
    ports:
      - 3001:3000              # LAN: http://<host-ip>:3001 (3000 is taken by wikijs)
    networks:
      - default
      - tunnel                 # tunnel service url: http://homepage:3000 (container port, not 3001)
    restart: unless-stopped

  # Read-only Docker API for container status. Kept off the tunnel network and unpublished,
  # so only homepage can reach it.
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped


networks:
  tunnel:
    external: true

