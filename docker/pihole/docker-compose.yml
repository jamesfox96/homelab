services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 8081:80/tcp       # web UI: http://192.168.0.200:8081/admin
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: ALL                 # required with Docker's default bridge network
      FTLCONF_dns_upstreams: 9.9.9.9;149.112.112.112  # Quad9
      FTLCONF_dns_dnssec: "true"
    volumes:
      - ${APPDATA}/pihole:/etc/pihole
    restart: unless-stopped
